<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1f2a35" stroke-width="1"/>
    </pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111820"/>
      <stop offset="100%" stop-color="#0b1016"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="420" rx="18" fill="#0b1016"/>
  <rect width="1400" height="420" rx="18" fill="url(#grid)" opacity="0.8"/>
  <rect x="18" y="18" width="1364" height="384" rx="12" fill="none" stroke="#58c7f3" stroke-width="3"/>

  <!-- top bar -->
  <rect x="18" y="18" width="1364" height="58" rx="12" fill="#111820"/>
  <rect x="18" y="64" width="1364" height="12" fill="#111820"/>
  <circle cx="50" cy="47" r="8" fill="#3fb950"/>
  <text x="70" y="55" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#dbe7f0">PLAYER PROFILE // ONLINE</text>
  <text x="1180" y="55" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#8b949e">slot_01.sav</text>

  <!-- left main profile -->
  <text x="64" y="145" font-family="Arial Black, Arial, sans-serif" font-size="76" fill="#ffffff">BEANSARDRE</text>
  <text x="68" y="185" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#58c7f3">FULL-STACK DEV  •  SYSTEMS  •  AI  •  3D</text>

  <rect x="64" y="218" width="650" height="118" rx="10" fill="url(#panel)" stroke="#263241" stroke-width="2"/>
  <text x="88" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8b949e">ACTIVE QUEST</text>
  <text x="88" y="282" font-family="Arial Black, Arial, sans-serif" font-size="32" fill="#f2cc60">PROJECTVERSE 3D</text>
  <text x="88" y="314" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#dbe7f0">codebase → architecture snapshot → 2D / 3D visualizer</text>

  <!-- right HUD -->
  <rect x="790" y="104" width="530" height="232" rx="12" fill="url(#panel)" stroke="#263241" stroke-width="2"/>
  <text x="820" y="140" font-family="Arial Black, Arial, sans-serif" font-size="24" fill="#a371f7">PLAYER INFO</text>

  <text x="820" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8b949e">CLASS</text>
  <text x="975" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#ffffff">Full-Stack Developer</text>
  <text x="820" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8b949e">REGION</text>
  <text x="975" y="214" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#ffffff">Philippines</text>
  <text x="820" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8b949e">BUILD MODE</text>
  <text x="975" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#3fb950">SHIP / BREAK / FIX</text>
  <text x="820" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8b949e">TRAIT</text>
  <text x="975" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#ffffff">ideas become systems</text>

  <!-- pixel controller -->
  <g transform="translate(1135 312)">
    <rect x="0" y="0" width="128" height="58" rx="18" fill="#151f2a" stroke="#58c7f3" stroke-width="3"/>
    <rect x="22" y="15" width="12" height="28" fill="#dbe7f0"/>
    <rect x="14" y="23" width="28" height="12" fill="#dbe7f0"/>
    <circle cx="92" cy="21" r="7" fill="#a371f7"/>
    <circle cx="107" cy="36" r="7" fill="#f2cc60"/>
  </g>

  <text x="64" y="382" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8b949e">PRESS START TO VIEW PROJECTS</text>
  <rect x="388" y="365" width="12" height="22" fill="#58c7f3"><animate attributeName="opacity" values="1;.2;1" dur="1s" repeatCount="indefinite"/></rect>
</svg>